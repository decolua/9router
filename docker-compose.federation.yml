# FED-006 — federation deployment example: 1 central + 2 edge instances.
#
# This is an EXAMPLE compose file for the federation feature (docs/FEDERATION.md).
# It does NOT replace docker-compose.yml (the standalone single-instance
# deployment) — standalone stays untouched. To use it:
#
#   docker compose -p 9router-federation -f docker-compose.federation.yml up -d --build
#
# Running alongside an existing 9router (e.g. a live install already serving
# 20128): every container name and published host port is overridable, so a
# second stack can coexist with it:
#
#   FEDERATION_STACK_PREFIX=9r-fed \
#   FEDERATION_CENTRAL_PORT=21128 \
#   FEDERATION_EDGE_A_PORT=21129 \
#   FEDERATION_EDGE_B_PORT=21130 \
#   docker compose -p 9router-federation -f docker-compose.federation.yml up -d --build
#
#   FEDERATION_STACK_PREFIX   container-name prefix      (default 9router)
#   FEDERATION_CENTRAL_PORT   central published port     (default 20128)
#   FEDERATION_EDGE_A_PORT    edge-a published port      (default 20129)
#   FEDERATION_EDGE_B_PORT    edge-b published port      (default 20130)
#
# Only the HOST side moves: the container-side port stays 20128 on all three
# instances, and FEDERATION_CENTRAL_URL stays http://central:20128 (an
# in-network service name + container port — host port overrides never touch
# intra-network traffic). The explicit `-p 9router-federation` keeps this
# stack's Compose project, network, and named volumes separate from an existing
# stack, so it cannot reuse that stack's state. See docs/FEDERATION.md §6.1.
#
# Topology:
#   central  — authoritative writer; serves its own dashboard + /v1 + the
#              federation API (snapshot/delta/verify/status/replay)
#   edge-a   — proxies /v1 + mutating dashboard API up to central while
#              LINKED; serves from its local replica when central is down
#   edge-b   — same, second edge (per-datacenter or per-host)
#
# All three share federation_net; each has its OWN data volume (the replica
# DBs are per-instance). FEDERATION_TOKEN must be the same on every instance
# (it is the edge↔central shared secret). JWT_SECRET/API_KEY_SECRET should
# also be shared so dashboard sessions and API keys work identically on
# every instance (see docs/FEDERATION.md §Env matrix for the sharing policy).
#
# TLS: the federation protocol carries provider credentials + API keys, so
# in production put a TLS terminator (Caddy/Traefik) in front of central and
# set FEDERATION_CENTRAL_URL to the https:// URL. The example uses plain
# http://central:20128 for local testing only.
#
# Tuning knobs (all optional — defaults in src/lib/federation/config.js):
#   FEDERATION_SYNC_INTERVAL_MS      delta poll interval (default 5000)
#   FEDERATION_HEARTBEAT_INTERVAL_MS  verify heartbeat (default 2000)
#   FEDERATION_OUTAGE_THRESHOLD_MS    consecutive-failure window → DEGRADED
#                                     (default 15000)
#   FEDERATION_QUEUE_MAX              pendingWrites cap (default 10000)
#   FEDERATION_REPLAY_BATCH_SIZE      replay batch on recovery (default 50)
#   FEDERATION_REDACT_FIELDS          optional JSON-path redaction for
#                                     proxy-only edges (comma-separated)
#
# The image is built from Dockerfile.federation (the standalone Dockerfile
# plus the src/ tree + @/ alias the federation runtime modules need). If you
# publish a federation image, replace `build:` with `image:`.

x-federation-common: &federation-common
  build:
    context: .
    dockerfile: Dockerfile.federation
  restart: unless-stopped
  # Shared secrets — FEDERATION_TOKEN, JWT_SECRET, API_KEY_SECRET and
  # INITIAL_PASSWORD — are NOT baked into this file. They are read from .env
  # via env_file below so nothing secret lands in git. They MUST be identical
  # on every federation instance (see docs/FEDERATION.md §3). Get started:
  #   cp .env.example .env   (then edit the placeholder values; .env is gitignored)
  env_file:
    - .env
  environment: &federation-env
    NODE_ENV: production
    HOSTNAME: "0.0.0.0"
    DATA_DIR: /app/data
    # Federation knobs (optional; defaults shown)
    FEDERATION_SYNC_INTERVAL_MS: "5000"
    FEDERATION_HEARTBEAT_INTERVAL_MS: "2000"
    FEDERATION_OUTAGE_THRESHOLD_MS: "15000"
    FEDERATION_QUEUE_MAX: "10000"
    FEDERATION_REPLAY_BATCH_SIZE: "50"
  networks:
    - federation_net

services:
  central:
    <<: *federation-common
    container_name: ${FEDERATION_STACK_PREFIX:-9router}-central
    ports:
      - "${FEDERATION_CENTRAL_PORT:-20128}:20128"
    environment:
      <<: *federation-env
      FEDERATION_MODE: central
    volumes:
      - central-data:/app/data

  edge-a:
    <<: *federation-common
    container_name: ${FEDERATION_STACK_PREFIX:-9router}-edge-a
    ports:
      - "${FEDERATION_EDGE_A_PORT:-20129}:20128"
    environment:
      <<: *federation-env
      FEDERATION_MODE: edge
      FEDERATION_EDGE_ID: edge-a
      FEDERATION_CENTRAL_URL: http://central:20128
    volumes:
      - edge-a-data:/app/data
    depends_on:
      - central

  edge-b:
    <<: *federation-common
    container_name: ${FEDERATION_STACK_PREFIX:-9router}-edge-b
    ports:
      - "${FEDERATION_EDGE_B_PORT:-20130}:20128"
    environment:
      <<: *federation-env
      FEDERATION_MODE: edge
      FEDERATION_EDGE_ID: edge-b
      FEDERATION_CENTRAL_URL: http://central:20128
    volumes:
      - edge-b-data:/app/data
    depends_on:
      - central

networks:
  federation_net:
    driver: bridge

volumes:
  central-data:
  edge-a-data:
  edge-b-data:
