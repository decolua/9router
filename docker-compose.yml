services:
  9router:
    image: decolua/9router:latest
    container_name: 9router
    restart: always
    mem_limit: 1g   # 2026-08-03: cap RAM
    mem_reservation: 256m
    ports:
      - "20128:20128"
    volumes:
      - 9router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      # HEADROOM_URL removed — headroom service optional, run 9Router standalone

volumes:
  9router-data:
    name: 9router-data
