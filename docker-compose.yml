services:
  10router:
    image: some-du6e/10router:latest
    container_name: 10router
    restart: always
    ports:
      - "20128:20128"
    volumes:
      # Volume name "9router-data" is retained for compatibility with existing installs —
      # renaming it would orphan the data of anyone upgrading.
      - 9router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"

volumes:
  # Kept as "9router-data" on purpose: renaming the named volume would orphan existing user data.
  9router-data:
    name: 9router-data
