guards:
  secrets: true
  lint: false
  tests: true
  test_mode: full
  test_command: ./scripts/gitreins-guard-tests.sh
  static_analysis: false
evaluator:
  model: deepseek-v4-flash
  max_iterations: 100
  max_time: "10m"
  max_input_tokens: "1M"
  max_output_tokens: "384k"
  static_analysis_diagnostics: false
history:
  enabled: true
  storage: git
  max_verdicts: 1000
pipeline:
  stages:
    - guard
    - evaluate
