# GitReins — gitleaks configuration
# Auto-generated by 'gitreins init'. Edit to add project-specific exclusions.
# See: https://github.com/gitleaks/gitleaks#configuration

# Catch all sk- prefixed API keys (OpenAI, OpenRouter, DeepSeek, etc.)
# 20+ chars — lower than gitleaks' default 32-char minimum
[[rules]]
id = "sk-api-key"
description = "OpenAI/OpenRouter/DeepSeek API key (sk- prefix)"
regex = '''(?i)sk-[a-zA-Z0-9_-]{20,}'''

[allowlist]
description = "Auto-generated by gitreins init — skip dependency dirs, docs, specs"

paths = [
  '''\.git/''',
  '''\.gitreins/''',
  '''\.gitreins/history/''',
  '''.*\.log$''',
  '''node_modules/''',
  '''\.pnpm-store/''',
  '''apps/.*/node_modules/''',
  '''packages/.*/node_modules/''',
  '''apps/.*/dist/''',
  '''packages/.*/dist/''',
  '''dist/''',
  '''build/''',
  '''\.turbo/''',
  '''\.next/''',
  '''coverage/''',
  '''specs/''',
  '''docs/''',
  '''.*\.spec\.md$''',
  '''.*\.md$''',
  '''tests/unit/embeddings.cloud.test.js''',
  '''tests/unit/xai-video-core.test.js''',
  # Upstream's OAuth client-constants file: every key-like string in it is a
  # PUBLIC client identifier by design (Firebase web key, zed/trae/windsurf
  # clientIds, clientSecret:"-") — published verbatim in decolua/9router.
  # Whole-tree scan trips on it whenever a backport touches the file.
  # (Both gitreins' built-in scanner and gitleaks itself honor this paths list.)
  '''src/lib/oauth/constants/oauth\.js''',
  # SYNC-9ROUTER-001: usage-attribution test uses FAKE placeholder keys
  # ("sk-mac...1111"/"sk-mac...2222") to prove same-prefix keys land in
  # separate buckets. gitleaks' generic-api-key rule trips on the sk- shape
  # despite the ellipsis; the values are not credentials.
  '''tests/unit/usage-api-key-attribution\.test\.js''',
  # DF-9ROUTER-54: cli show/connect tests use FAKE ellipsized placeholder keys
  # ("sk-sho...6789"/"sk-ser...9999") — not credentials, same class as above.
  '''tests/unit/cli-show\.test\.js''',
  '''tests/unit/cli-connect\.test\.js''',
  # DF-9ROUTER-56: guard-envelope test uses a self-describing FAKE
  # placeholder Bearer ("sk-def" + "initely-not-a-key", not a credential)
  # as the invalid key the guard must reject with the OpenAI envelope.
  '''tests/unit/guard-error-envelope-56\.test\.js''',
  # NOUS-OAUTH: nous-provider OAuth refresh tests use a self-describing
  # FAKE placeholder key ("sk-nous-agent-refr..." — 23-char nous fixture)
  # as the refreshed agent key returned by the mocked OAuth endpoint — a
  # fixture value, not a credential (landed in 165f9b90). Same class as
  # above. (Comment elides the literal so this file itself stays clean.)
  '''tests/unit/nous-provider\.test\.js''',
]
