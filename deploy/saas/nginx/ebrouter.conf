# nginx reverse proxy for ebRouter SaaS (alternative to Caddy).
#
# Install on the host (not in docker-compose) or adapt into your own image.
# Replace APP_EXAMPLE_COM with your SAAS_BASE_DOMAIN.
#
# Wildcard TLS: use certbot DNS plugin, e.g.:
#   certbot certonly --dns-cloudflare \
#     --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
#     -d app.example.com -d '*.app.example.com'
#
# Per-org rate limit: keyed on subdomain ($host). Tune rates for your plan tiers.

limit_req_zone $host zone=ebrouter_per_org:20m rate=120r/m;
limit_req_status 429;

upstream ebrouter_app {
    server 127.0.0.1:20128;
    keepalive 32;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com *.app.example.com;
    return 301 https://$host$request_uri;
}

# Apex + wildcard HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.example.com *.app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 32m;

    # Per-org (subdomain) request rate limit on API paths
    location ~ ^/(v1|api/v1)/ {
        limit_req zone=ebrouter_per_org burst=40 nodelay;
        proxy_pass http://ebrouter_app;
        include /etc/nginx/snippets/ebrouter-proxy.conf;
    }

    location / {
        proxy_pass http://ebrouter_app;
        include /etc/nginx/snippets/ebrouter-proxy.conf;
    }
}
