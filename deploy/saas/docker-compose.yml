# ebRouter SaaS production stack — app + PostgreSQL + optional Caddy reverse proxy
# Run from this folder: docker compose up -d
# With TLS proxy:     docker compose --profile proxy up -d
# Requires a .env file (generated by install.sh)

name: ${COMPOSE_PROJECT_NAME:-ebrouter-saas}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ebrouter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ebrouter}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ebrouter:
    image: ${EBROUTER_IMAGE:?Set EBROUTER_IMAGE in .env}
    restart: unless-stopped
    # Bind to localhost when using the proxy profile; set EBROUTER_BIND=0.0.0.0:20128 for dev without TLS.
    ports:
      - "${EBROUTER_BIND:-127.0.0.1:20128}:20128"
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      DEPLOY_MODE: saas
      SAAS_BASE_DOMAIN: ${SAAS_BASE_DOMAIN:?Set SAAS_BASE_DOMAIN in .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-ebrouter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ebrouter}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      API_KEY_SECRET: ${API_KEY_SECRET:?Set API_KEY_SECRET in .env}
      MACHINE_ID_SALT: ${MACHINE_ID_SALT:?Set MACHINE_ID_SALT in .env}
      MASTER_KEY: ${MASTER_KEY:-}
      BASE_URL: ${BASE_URL:-https://${SAAS_BASE_DOMAIN}}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://${SAAS_BASE_DOMAIN}}
      CLOUD_URL: ${CLOUD_URL:-}
      NEXT_PUBLIC_CLOUD_URL: ${NEXT_PUBLIC_CLOUD_URL:-}
      ENABLE_REQUEST_LOGS: ${ENABLE_REQUEST_LOGS:-false}
      REQUIRE_API_KEY: ${REQUIRE_API_KEY:-true}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-true}
      API_RATE_LIMIT_PER_MIN: ${API_RATE_LIMIT_PER_MIN:-120}
      API_RATE_LIMIT_PER_KEY_PER_MIN: ${API_RATE_LIMIT_PER_KEY_PER_MIN:-300}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    volumes:
      - ebrouter_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:20128/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    profiles: ["proxy"]
    build:
      context: ./caddy
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SAAS_BASE_DOMAIN: ${SAAS_BASE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      ebrouter:
        condition: service_healthy

volumes:
  pgdata:
  ebrouter_data:
  caddy_data:
  caddy_config:
