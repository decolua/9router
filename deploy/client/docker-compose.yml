# ebRouter production client stack — app + PostgreSQL
# Run from this folder: docker compose up -d
# Requires a .env file (generated by install.ps1 / install.sh)

name: ${COMPOSE_PROJECT_NAME:-ebrouter}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ebrouter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ebrouter}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Postgres is internal only — not exposed to the host network.

  ebrouter:
    image: ${EBROUTER_IMAGE:?Set EBROUTER_IMAGE in .env}
    restart: unless-stopped
    ports:
      - "${PORT:-20128}:20128"
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-ebrouter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ebrouter}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:?Set INITIAL_PASSWORD in .env}
      MASTER_KEY: ${MASTER_KEY:-}
      API_KEY_SECRET: ${API_KEY_SECRET:?Set API_KEY_SECRET in .env}
      MACHINE_ID_SALT: ${MACHINE_ID_SALT:?Set MACHINE_ID_SALT in .env}
      BASE_URL: ${BASE_URL:-http://localhost:20128}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:20128}
      CLOUD_URL: ${CLOUD_URL:-}
      NEXT_PUBLIC_CLOUD_URL: ${NEXT_PUBLIC_CLOUD_URL:-}
      ENABLE_REQUEST_LOGS: ${ENABLE_REQUEST_LOGS:-false}
      REQUIRE_API_KEY: ${REQUIRE_API_KEY:-true}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-true}
    volumes:
      - ebrouter_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:20128/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
  ebrouter_data:
