<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RealmForge GeoCommand</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body,#map{height:100%;margin:0}body{background:#08101d;color:#e7f5ff;font:14px system-ui}#map{z-index:0}.panel{position:absolute;z-index:1000;top:12px;left:12px;right:12px;background:#0a1429eF;border:1px solid #4c7e9a;border-radius:15px;padding:12px;box-shadow:0 8px 30px #0009}.title{font-weight:800;letter-spacing:1px;color:#7ce8ff;margin-bottom:9px}.controls{display:flex;gap:6px;flex-wrap:wrap}input{min-width:0;flex:1 1 130px;background:#162841;color:white;border:1px solid #4a7698;border-radius:8px;padding:9px}button{background:#173e5b;border:1px solid #4a9ac3;color:#e6f9ff;border-radius:8px;padding:9px;cursor:pointer}button:active{background:#27779a}#status{font-size:12px;color:#b5d6e7;margin-top:8px}.leaflet-control-zoom{margin-top:168px!important}</style></head><body><div id="map"></div><section class="panel"><div class="title">◈ REALMFORGE · GEOCOMMAND V3</div><div class="controls"><input id="query" placeholder="Search place or address" aria-label="Search place"><button id="search">Search</button><button id="locate">My location</button><button id="satellite">Satellite</button><button id="marker">Add pin</button><button id="measure">Measure</button></div><div id="status" role="status">Map ready · Internet required for map tiles and search</div></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const status=document.getElementById('status');function say(s){status.textContent=s}
if(typeof L==='undefined'){say('Map library unavailable. Connect to the internet.')}else{
const map=L.map('map',{zoomControl:false}).setView([-33.96,25.60],12);L.control.zoom({position:'bottomright'}).addTo(map);
const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery © Esri'});
let sat=false,mode='',points=[],line=null;
document.getElementById('satellite').onclick=()=>{map.removeLayer(sat?satellite:osm);(sat?osm:satellite).addTo(map);sat=!sat;say(sat?'Satellite imagery':'Street map')};
document.getElementById('locate').onclick=()=>{if(!navigator.geolocation)return say('Geolocation unavailable');say('Finding your location…');navigator.geolocation.getCurrentPosition(p=>{const a=[p.coords.latitude,p.coords.longitude];map.setView(a,16);L.marker(a).addTo(map).bindPopup('Current location').openPopup();say('Location found')},e=>say('Location unavailable: '+e.message),{enableHighAccuracy:true,timeout:15000})};
document.getElementById('marker').onclick=()=>{mode=mode==='marker'?'':'marker';say(mode?'Tap the map to place a pin':'Pin mode off')};
document.getElementById('measure').onclick=()=>{mode=mode==='measure'?'':'measure';points=[];if(line)map.removeLayer(line);line=null;say(mode?'Tap two points to measure distance':'Measure mode off')};
map.on('click',e=>{if(mode==='marker'){L.marker(e.latlng).addTo(map).bindPopup(e.latlng.lat.toFixed(5)+', '+e.latlng.lng.toFixed(5));say('Pin added');mode=''}else if(mode==='measure'){points.push(e.latlng);if(points.length===2){line=L.polyline(points,{color:'#60e4ff',weight:4}).addTo(map);say('Distance: '+(points[0].distanceTo(points[1])/1000).toFixed(2)+' km');points=[];mode=''}}});
async function search(){const q=document.getElementById('query').value.trim();if(!q)return say('Enter a location');say('Searching…');try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}});if(!r.ok)throw Error('Search service unavailable');const d=await r.json();if(!d.length)return say('No results');const a=[+d[0].lat,+d[0].lon];map.setView(a,15);L.marker(a).addTo(map).bindPopup(d[0].display_name).openPopup();say(d[0].display_name)}catch(e){say('Search failed: '+e.message)}}
document.getElementById('search').onclick=search;document.getElementById('query').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
}</script></body></html>
