<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RealmForge Scene Studio</title><style>body{font:16px system-ui;background:#101629;color:#fff;margin:0;padding:20px}main{max-width:960px;margin:auto}canvas{width:100%;touch-action:none;background:#29334c;border-radius:12px}button,input{margin:6px;padding:8px}label{display:inline-block}</style><main><h1>RealmForge Scene Studio</h1><p>Offline 2D scene compositor with simulated 3D shapes. No AI or camera tracking.</p><label>Background <input id="photo" type="file" accept="image/*"></label><canvas id="stage" width="960" height="540"></canvas><div><button id="cube">Cube</button><button id="sphere">Sphere</button><button id="reset">Reset</button><button id="save">Export PNG</button></div><label>Size <input id="size" type="range" min="30" max="260" value="110"></label><label>Rotation <input id="angle" type="range" min="0" max="360" value="25"></label><label>Opacity <input id="alpha" type="range" min="10" max="100" value="95"></label></main><script>
const c=document.getElementById('stage'),g=c.getContext('2d'),el=id=>document.getElementById(id);let bg=null,shape='cube',x=480,y=270,drag=false;
function draw(){g.clearRect(0,0,960,540);g.fillStyle='#29334c';g.fillRect(0,0,960,540);if(bg){const s=Math.max(960/bg.width,540/bg.height),w=bg.width*s,h=bg.height*s;g.drawImage(bg,(960-w)/2,(540-h)/2,w,h)}const r=+el('size').value,a=+el('angle').value*Math.PI/180;g.save();g.translate(x,y);g.rotate(a);g.globalAlpha=+el('alpha').value/100;g.fillStyle='#0007';g.beginPath();g.ellipse(8,r*.55,r*.6,r*.18,0,0,Math.PI*2);g.fill();if(shape==='sphere'){const grad=g.createRadialGradient(-r*.2,-r*.2,1,0,0,r*.6);grad.addColorStop(0,'#e8fbff');grad.addColorStop(.5,'#47b4e8');grad.addColorStop(1,'#132f75');g.fillStyle=grad;g.beginPath();g.arc(0,0,r*.5,0,Math.PI*2);g.fill()}else{const z=r*.5;g.fillStyle='#72d5f5';g.fillRect(-z,-z,1.5*z,1.5*z);g.fillStyle='#2379ba';g.beginPath();g.moveTo(.5*z,-z);g.lineTo(z,-1.4*z);g.lineTo(z,.1*z);g.lineTo(.5*z,.5*z);g.fill();g.fillStyle='#b3eeff';g.beginPath();g.moveTo(-z,-z);g.lineTo(-.5*z,-1.4*z);g.lineTo(z,-1.4*z);g.lineTo(.5*z,-z);g.fill()}g.restore()}
el('photo').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{bg=im;draw();URL.revokeObjectURL(url)};im.onerror=()=>URL.revokeObjectURL(url);im.src=url});['size','angle','alpha'].forEach(id=>el(id).oninput=draw);['cube','sphere'].forEach(id=>el(id).onclick=()=>{shape=id;draw()});el('reset').onclick=()=>{x=480;y=270;draw()};function point(e){const b=c.getBoundingClientRect();return [(e.clientX-b.left)*960/b.width,(e.clientY-b.top)*540/b.height]}c.onpointerdown=e=>{drag=true;c.setPointerCapture(e.pointerId);[x,y]=point(e);draw()};c.onpointermove=e=>{if(drag){[x,y]=point(e);draw()}};c.onpointerup=c.onpointercancel=()=>drag=false;el('save').onclick=()=>{const a=document.createElement('a');a.download='realmforge-scene.png';a.href=c.toDataURL('image/png');a.click()};draw();
</script></html>
