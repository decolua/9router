name: Test and Publish Main Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: 9router-main-image
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/caprol55555/9router

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install application dependencies
        run: npm install

      - name: Install test dependencies
        run: npm --prefix tests install

      - name: Run usage, cache, and request logging tests
        working-directory: tests
        run: >-
          npx vitest run
          unit/usage-logs.test.js
          unit/cached-token-usage.test.js
          unit/usage-concern.test.js
          unit/request-details-redaction.test.js
          --reporter=verbose

      - name: Build production application
        run: npm run build

  build-and-push:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64
          provenance: false
          sbom: false
