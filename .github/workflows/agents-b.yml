name: agents-b image (GHCR)

on:
  push:
    branches: ["agents-b"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/darmajiessss/9router:agents-b
            ghcr.io/darmajiessss/9router:latest
          build-args: |
            APP_VERSION=agents-b
          cache-from: type=gha
          cache-to: type=gha,mode=max
