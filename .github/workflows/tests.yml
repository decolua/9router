name: Test Suite

on:
  push:
    branches: [federation, master]
  pull_request:
    branches: [federation, master]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install test dependencies (independent ESM package)
        working-directory: tests
        run: npm ci

      # The suite is NOT all-green by design (~88 known-fails in
      # tests/__baseline__/known-fails.txt). The regression gate
      # (verify-no-regression.mjs) is the authoritative pass/fail signal —
      # never gate on the raw vitest exit code.
      - name: Run vitest + regression gate
        run: bash scripts/gitreins-guard-tests.sh
