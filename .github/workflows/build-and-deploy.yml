name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
      
      - name: Download latest CLI
        run: |
          mkdir -p temp-cli
          cd temp-cli
          npm init -y
          npm install 9router@latest
          cd ..
          rm -rf cli/
          mv temp-cli/node_modules/9router ./cli
          rm -rf temp-cli
      
      - name: Install dependencies
        run: npm install

      - name: Build
        run: |
          tree -L 3 .
          npm run build
          tree -L 3 .

      - name: Bump version
        run: |
          TIMESTAMP=$(date +%s)
          npm version patch --no-git-tag-version
          npm version prerelease --preid=patch.$TIMESTAMP --no-git-tag-version
      
      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
