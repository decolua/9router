name: CodeQL

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "23 4 * * 1" # weekly, catches new queries against unchanged code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload results to the Security → Code scanning tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          build-mode: none
          # security-extended adds the SSRF / path-injection / command-injection queries
          # that match this project's past advisories.
          queries: security-extended
          config: |
            paths-ignore:
              - tests
              - gitbook
              - i18n
              - "**/node_modules"
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:javascript-typescript"
