name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege: jobs only read the repo. Nothing here needs secrets, so this
# is safe to run on fork PRs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22" # matches the Dockerfile base image
  NEXT_TELEMETRY_DISABLED: "1"
  # Use the committed lockfile when present (npm ci); fall back to npm install until it lands.
  ROOT_INSTALL: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund --legacy-peer-deps; fi

jobs:
  security-tests:
    name: Security regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: eval "$ROOT_INSTALL"
      - run: npm install --no-audit --no-fund --legacy-peer-deps
        working-directory: tests
      - name: Run tests listed in tests/security-suite.txt (hard gate)
        working-directory: tests
        # Entries for tests that land in a not-yet-merged PR are skipped with a warning,
        # so they switch on automatically once merged.
        run: |
          files=()
          while read -r f; do
            if [ -f "$f" ]; then files+=("$f"); else echo "::warning file=tests/security-suite.txt::$f not found yet, skipped"; fi
          done < <(grep -vE '^\s*(#|$)' security-suite.txt | tr -d '\r')
          npx vitest run "${files[@]}"

  # The suite is not all-green on master, so the gate compares against the PR's base
  # commit: a test that fails on the base is pre-existing, one that passes there and
  # fails here is a regression. tests/__baseline__/known-fails.txt still applies (flaky
  # tests, and the only baseline for pushes to master).
  test-run:
    name: Test suite (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [head, base]
    steps:
      - if: matrix.target == 'head' || github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.target == 'base' && github.event.pull_request.base.sha || '' }}
      - if: matrix.target == 'head' || github.event_name == 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - if: matrix.target == 'head' || github.event_name == 'pull_request'
        run: eval "$ROOT_INSTALL"
      - if: matrix.target == 'head' || github.event_name == 'pull_request'
        run: npm install --no-audit --no-fund --legacy-peer-deps
        working-directory: tests
      - if: matrix.target == 'head' || github.event_name == 'pull_request'
        name: Run full suite
        working-directory: tests
        run: npx vitest run --reporter=default --reporter=json --outputFile=results.json || true
      - if: matrix.target == 'head' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.target }}
          path: tests/results.json
          if-no-files-found: error
          retention-days: 14

  test-suite:
    name: Full test suite (no-regression gate)
    needs: test-run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: test-results-*
      - name: No-regression gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node tests/__baseline__/verify-no-regression.mjs test-results-head/results.json --base test-results-base/results.json
          else
            node tests/__baseline__/verify-no-regression.mjs test-results-head/results.json
          fi

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: eval "$ROOT_INSTALL"
      - run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # npm audit reads the lockfile; resolve one without installing if none is committed.
      - run: '[ -f package-lock.json ] || npm install --package-lock-only --no-audit --no-fund --legacy-peer-deps'
      - name: npm audit (production deps, high+, reviewed exceptions only)
        run: |
          npm audit --omit=dev || true
          npm audit --omit=dev --json > audit.json || true
          node scripts/ci/audit-gate.mjs audit.json

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The action needs Settings → Code security → Dependency graph. Until a maintainer
      # enables it, skip with a notice instead of showing a red check; it starts
      # enforcing automatically once the graph is on.
      - name: Check dependency graph
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/dependency-graph/sbom" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Dependency graph is disabled for this repository; skipping dependency review."
          fi
      # Blocks PRs that add a dependency with a known high/critical advisory.
      - if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  lint:
    name: Lint changed files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory for now: master still has ~800 existing ESLint findings, so this only
    # reports on files the PR touches, as annotations, and never turns the check red.
    # Remove the step's continue-on-error to make it blocking once master is clean.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: eval "$ROOT_INSTALL"
      - name: ESLint on changed JS files
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- '*.js' '*.mjs' '*.jsx' > changed.txt
          if [ -s changed.txt ]; then xargs -d '\n' npx eslint < changed.txt; else echo "No JS changes"; fi
