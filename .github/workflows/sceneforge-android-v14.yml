name: SceneForge Studio Android debug APK
on:
  push:
    branches: [master, sceneforge-android-v14, 'feature/sceneforge-*']
    paths: ['sceneforge-android/**', '.github/workflows/sceneforge-android-v14.yml']
  pull_request:
    paths: ['sceneforge-android/**', '.github/workflows/sceneforge-android-v14.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sceneforge-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 using runner command-line tools
        run: |
          if command -v sdkmanager >/dev/null; then SDKMANAGER="$(command -v sdkmanager)"; else SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify origin-restricted native export bridge
        run: |
          test -f app/src/main/java/com/sceneforge/studio/MainActivity.java
          grep -Fq 'WebViewCompat.addWebMessageListener' app/src/main/java/com/sceneforge/studio/MainActivity.java
          grep -Fq 'Collections.singleton(APP_URL)' app/src/main/java/com/sceneforge/studio/MainActivity.java
          grep -Fq '!isMainFrame' app/src/main/java/com/sceneforge/studio/MainActivity.java
          if grep -Fq 'addJavascriptInterface' app/src/main/java/com/sceneforge/studio/MainActivity.java; then
            echo "::error::Unrestricted JavaScript bridge must not be used"
            exit 1
          fi
      - name: Build SceneForge native Android WebView wrapper
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Check APK and Android signature
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Verify SceneForge v15 Android release identity
        run: |
          grep -Fq 'applicationId = "com.sceneforge.studio"' app/build.gradle.kts
          grep -Fq 'versionCode = 15' app/build.gradle.kts
          grep -Fq 'versionName = "0.15-debug"' app/build.gradle.kts
      - uses: actions/upload-artifact@v4
        with:
          name: SceneForge-v15-debug-APK
          path: |
            sceneforge-android/app/build/outputs/apk/debug/app-debug.apk
            sceneforge-android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
